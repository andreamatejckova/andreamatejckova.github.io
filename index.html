<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Osobní Stránka</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --subtext-color: #6b7280;
            --btn-bg: #4f46e5;
            --btn-hover: #4338ca;
            --btn-text: #ffffff;
        }

        body.dark-mode {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --subtext-color: #9ca3af;
            --btn-bg: #6366f1;
            --btn-hover: #4f46e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid var(--btn-bg);
        }

        h1 {
            margin: 0.5rem 0 0.2rem;
            font-size: 1.5rem;
        }

        p {
            color: var(--subtext-color);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn {
            display: block;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="theme-toggle" onclick="toggleTheme()" title="Přepnout režim">🌓</button>
        
        <!-- Zde můžeš změnit odkaz na vlastní fotku -->
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Profilová fotka" class="avatar">
        
        <!-- Změň si jméno a popisek -->
        <h1>Tvoje Jméno</h1>
        <p>Tvůrce, nadšenec do technologií a milovník dobré kávy. Vítej na mém webu!</p>

        <!-- Tlačítka s odkazy -->
        <div class="links">
            <a href="https://instagram.com" target="_blank" class="btn">📸 Instagram</a>
            <a href="https://github.com" target="_blank" class="btn">💻 Můj GitHub</a>
            <a href="https://youtube.com" target="_blank" class="btn">🎬 YouTube kanál</a>
            <a href="mailto:tvuj@email.cz" class="btn">✉️ Napiš mi e-mail</a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }
    </script>

</body>
</html>
